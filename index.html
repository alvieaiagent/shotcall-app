u. They know your series, your running jokes and your face. Posts to them are retention and community — they are how an audience stays.","UNCONNECTED reach is the people who do not follow you, reached because a post was recommended, sent to them, or reposted into their feed. They owe you nothing and decide in seconds. Posts that travel to them are the growth engine — they are how an audience grows.","Every finding and every action in this report is tagged with the reach it serves. Some serve both, and those say so."],honesty:"The real split between the two lives in the account owner's Insights. It is not public, this audit cannot see it, and no line in this report pretends to. The section that holds it is at the end of this report, marked AWAITING OWNER DATA."},k0="PROXY — A CLUE, NOT A COUNT",E0="What follows is read from public numbers only. It can suggest that a post travelled beyond the account's followers. It cannot prove who watched, how many of them were not followers, or whether any of them followed afterwards. A proxy is never printed as a reach figure, and it is never added to the owner-data section.",_0="Where a proxy compares two numbers, both numbers are named, with what each one counts: a public view count counts plays recorded — it is not a list of people — and a follower count counts the accounts following at the time the numbers were entered.",A0="RUBRIC SCORE — CHECKS MET, OF THE CHECKS THIS AUDIT CAN RUN. IT SCORES THE PROFILE AND THE POSTS AGAINST THE CHECKS BELOW. IT IS NOT A PERFORMANCE NUMBER, AND IT DOES NOT COME FROM THE PLATFORM.",C0="Unless a finding says otherwise, it is read from the account's bio, its grid, and its last 9 posts, from the public surface at the time the numbers were entered. Counts in findings are counts of that sample, and the sample size prints with the count.",Vi={label:"BEFORE IT RUNS — WHAT THIS AUDIT CAN AND CANNOT SEE",canSee:["The bio, as written.","The grid and the post covers.","The captions, in full.","The coun
